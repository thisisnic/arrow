# Batch C of the CI bug testing in a personal fork: Windows MSVC builds of
# Arrow C++, based on apache/arrow's cpp_windows.yml. Round three: three
# configurations, one per issue, that the default build does not cover.
#   x86-32bit   GH-32111  does a 32-bit MSVC build work?
#   asan        GH-50244  arrow-utility-test under MSVC AddressSanitizer
#   examples    GH-47598  Parquet encryption examples (need <dirent.h>),
#               GH-45154  Arrow headers after <windows.h> without NOMINMAX
# Build and test failures in this workflow are results, not problems.
# All of Arrow's own workflows are deleted on this branch so only these run.

name: CI bug testing C (Windows MSVC)

on:
  push:
    branches:
      - 'ci-bug-testing/**'

permissions:
  contents: read

jobs:
  windows:
    name: Windows 2022 MSVC, ${{ matrix.config }}
    # Never run in apache/arrow itself.
    if: github.repository != 'apache/arrow'
    runs-on: windows-2022
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round four. The first x86 build stopped on 3,319 C4244 warnings
          # treated as errors, so this one lets warnings through to see what
          # else fails. ARROW_USE_ASAN is refused for MSVC by
          # san-config.cmake, so ASAN is passed as a compiler flag, in a
          # release build because /fsanitize=address cannot be combined with
          # the debug run-time checks. The Parquet examples need
          # PARQUET_BUILD_EXAMPLES, which the script leaves off by default.
          - config: x86-32bit
            vcvars: x86
            cxxflags: ""
            build-type: debug
            warning-level: PRODUCTION
            examples: "OFF"
            encryption: "OFF"
            tests: "ON"
            extras: "OFF"
          - config: asan
            vcvars: x64
            cxxflags: "/fsanitize=address"
            build-type: release
            warning-level: PRODUCTION
            examples: "OFF"
            encryption: "OFF"
            tests: "ON"
            extras: "OFF"
          - config: examples
            vcvars: x64
            cxxflags: ""
            build-type: debug
            warning-level: CHECKIN
            examples: "ON"
            encryption: "ON"
            tests: "OFF"
            extras: "OFF"
    env:
      ARROW_AZURE: ${{ matrix.extras }}
      ARROW_BOOST_USE_SHARED: OFF
      ARROW_BUILD_BENCHMARKS: OFF
      ARROW_BUILD_EXAMPLES: ${{ matrix.examples }}
      ARROW_BUILD_SHARED: ON
      ARROW_BUILD_STATIC: ON
      ARROW_BUILD_TESTS: ${{ matrix.tests }}
      ARROW_DATASET: ON
      ARROW_FILESYSTEM: ON
      ARROW_FLIGHT: OFF
      ARROW_HDFS: ${{ matrix.extras }}
      ARROW_HOME: /usr
      ARROW_JEMALLOC: OFF
      ARROW_MIMALLOC: ON
      ARROW_ORC: ${{ matrix.extras }}
      ARROW_PARQUET: ON
      ARROW_SUBSTRAIT: ${{ matrix.extras }}
      ARROW_BUILD_TYPE: ${{ matrix.build-type }}
      BUILD_WARNING_LEVEL: ${{ matrix.warning-level }}
      CFLAGS: ${{ matrix.cxxflags }}
      CXXFLAGS: ${{ matrix.cxxflags }}
      PARQUET_BUILD_EXAMPLES: ${{ matrix.examples }}
      ARROW_USE_GLOG: OFF
      ARROW_VERBOSE_THIRDPARTY_BUILD: OFF
      ARROW_WITH_BROTLI: OFF
      ARROW_WITH_BZ2: OFF
      ARROW_WITH_LZ4: OFF
      ARROW_WITH_OPENTELEMETRY: OFF
      ARROW_WITH_SNAPPY: ON
      ARROW_WITH_ZLIB: ON
      ARROW_WITH_ZSTD: ON
      BOOST_SOURCE: BUNDLED
      CMAKE_CXX_STANDARD: "20"
      CMAKE_GENERATOR: Ninja
      CMAKE_INSTALL_PREFIX: /usr
      CMAKE_MSVC_DEBUG_INFORMATION_FORMAT: Embedded
      CMAKE_UNITY_BUILD: ON
      PARQUET_REQUIRE_ENCRYPTION: ${{ matrix.encryption }}
      VCVARS_ARCH: ${{ matrix.vcvars }}
    steps:
      - name: Disable Crash Dialogs
        run: |
          reg add `
            "HKCU\SOFTWARE\Microsoft\Windows\Windows Error Reporting" `
            /v DontShowUI `
            /t REG_DWORD `
            /d 1 `
            /f
      - name: Checkout Arrow
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Install msys2 (for tzdata for ORC tests)
        uses: msys2/setup-msys2@v2
        id: setup-msys2
      - name: Install cmake
        shell: bash
        run: |
          ci/scripts/install_cmake.sh 4.1.2 /usr
      - name: Install ccache
        shell: bash
        run: |
          ci/scripts/install_ccache.sh 4.13.6 /usr
      - name: Setup ccache
        shell: bash
        run: |
          ci/scripts/ccache_setup.sh
      - name: Find Visual Studio
        shell: pwsh
        run: |
          "VS_INSTALL_PATH=$(vswhere -latest -property installationPath)" >> $env:GITHUB_ENV
      - name: Build
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvarsall.bat" %VCVARS_ARCH% || exit /b 1
          cl 2>&1 | findstr /C:"Version"
          bash -c "ci/scripts/cpp_build.sh $(pwd) $(pwd)/build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}"
      - name: Build again without stopping at the first error
        # Shows every compile error, not only the first one.
        if: failure()
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvarsall.bat" %VCVARS_ARCH% || exit /b 1
          bash -c "if [ -f build/cpp/build.ninja ]; then ninja -C build/cpp -k 0 2>&1 | tee build-keep-going.log; else echo 'configure did not finish; no build.ninja' | tee build-keep-going.log; fi; true"
          bash -c "echo 'Distinct errors:'; grep -E 'error [A-Z]+[0-9]+|fatal error' build-keep-going.log | sed -E 's/^.*((fatal )?error [A-Z]+[0-9]+.*)$/\1/' | sort | uniq -c | sort -rn | head -40; echo 'Targets that failed:'; grep -E '^FAILED:' build-keep-going.log | sort -u | head -40; true"
      - name: Warnings worth knowing about
        if: always()
        shell: bash
        run: |
          echo "D9002 / unknown option lines (GH-50527): $(grep -c -i -E 'D9002|ignoring unknown option' build.log || true)"
          grep -i -E 'D9002|ignoring unknown option' build.log | sort | uniq -c | sort -rn | head -5 || true
          echo "Distinct /arch flags:"; grep -o -E '[/-]arch:[A-Za-z0-9.]+' build.log | sort | uniq -c || true
          echo "Version-script probe (GH-50449):"; grep -i 'VERSION_SCRIPT' build.log | sort -u || true
      - name: arrow-utility-test (GH-50244 under ASAN; also run for x86)
        if: always() && matrix.tests == 'ON'
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvarsall.bat" %VCVARS_ARCH% || exit /b 1
          set TZDIR=%MSYS2_LOCATION%\usr\share\zoneinfo
          bash -c "export ARROW_TEST_DATA=$(pwd)/testing/data PARQUET_TEST_DATA=$(pwd)/cpp/submodules/parquet-testing/data; cd build/cpp 2>/dev/null && ctest -R '^arrow-utility-test$' --output-on-failure 2>&1 | tee ../../utility-test.log; true"
      - name: Full test run (x86 only)
        if: always() && matrix.config == 'x86-32bit'
        shell: cmd
        env:
          MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvarsall.bat" %VCVARS_ARCH% || exit /b 1
          set TZDIR=%MSYS2_LOCATION%\usr\share\zoneinfo
          bash -c "ci/scripts/cpp_test.sh $(pwd) $(pwd)/build 2>&1 | tee test.log; true"
      - name: Arrow headers after windows.h without NOMINMAX (GH-45154)
        if: always() && matrix.config == 'examples'
        shell: cmd
        run: |
          call "%VS_INSTALL_PATH%\VC\Auxiliary\Build\vcvarsall.bat" %VCVARS_ARCH% || exit /b 1
          echo #include ^<windows.h^> > nominmax.cpp
          echo #include ^<arrow/api.h^> >> nominmax.cpp
          echo int main() { return 0; } >> nominmax.cpp
          type nominmax.cpp
          cl /nologo /c /EHsc /std:c++20 /I cpp\src /I build\cpp\src nominmax.cpp > nominmax.log 2>&1
          echo cl exit code %ERRORLEVEL% >> nominmax.log
          bash -c "echo 'First lines:'; head -30 nominmax.log; echo; echo 'Distinct errors:'; grep -o -E 'error C[0-9]+' nominmax.log | sort | uniq -c; echo 'Headers with errors:'; grep -E 'error C[0-9]+' nominmax.log | sed -E 's/\([0-9,]+\).*//' | sort | uniq -c | sort -rn | head -20; tail -1 nominmax.log; true"
          exit /b 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-windows-msvc-${{ matrix.config }}
          path: |
            build.log
            build-keep-going.log
            utility-test.log
            test.log
            nominmax.log
