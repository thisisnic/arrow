name: CI bug testing A

# Runs reporters' scripts for old apache/arrow bug reports against released
# pyarrow wheels and the released R package. Nothing here builds Arrow.
# Intended for a personal fork only.

on:
  push:
    branches:
      - 'ci-bug-testing/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Comma-separated case names for the `reprex` job (see cases.json). Empty
  # runs everything. Currently narrowed to the batch A follow-ups; set it
  # back to "" to re-run the whole of batch A.
  ONLY_CASES: "38812-repeat"
  # Set to "1" to install R and run the R cases.
  RUN_R: "0"

jobs:
  # Batch B: S3 and GCS issues against local emulators (MinIO and Google's
  # storage testbench) on Linux. No real cloud accounts or credentials.
  emulators:
    name: emulators (MinIO, GCS testbench)
    # Never run in apache/arrow itself.
    if: github.repository != 'apache/arrow'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Fetch Arrow's emulator install scripts
        # Read-only download of two public scripts from apache/arrow, pinned
        # to a fixed commit so they cannot change between runs.
        run: |
          mkdir -p ci-scripts out
          sha=95c2fb75626e411ce20111b2139d517675084d6e
          for f in install_minio.sh install_gcs_testbench.sh; do
            curl -fsSL -o "ci-scripts/$f" "https://raw.githubusercontent.com/apache/arrow/$sha/ci/scripts/$f"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install MinIO
        run: bash ci-scripts/install_minio.sh latest "$HOME/.local"
      - name: Install GCS testbench
        run: bash ci-scripts/install_gcs_testbench.sh default
      - name: Start emulators
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup minio server --quiet --address 127.0.0.1:9000 "$RUNNER_TEMP/minio-data" \
            > out/minio.log 2>&1 &
          nohup storage-testbench --port 9001 > out/gcs-testbench.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          for i in $(seq 1 30); do
            curl -sS -o /dev/null http://127.0.0.1:9001/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/live && echo "MinIO is up"
          curl -sS -o /dev/null -w "GCS testbench answered with HTTP %{http_code}\n" http://127.0.0.1:9001/ || true
          mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
      - name: Run scripts
        env:
          PYTHONUTF8: "1"
          ONLY_CASES: ""
          R_CASES: "0"
        run: python driver.py --cases cases-b.json --out out --label "emulators"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-emulators
          path: out/

  reprex:
    name: ${{ matrix.os }}
    # Never run in apache/arrow itself.
    if: github.repository != 'apache/arrow'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2022
          - macos-26
          - macos-15-intel
          # windows-11-arm works as a runner, but pyarrow has no wheel for it,
          # so it is only useful for #40812. Add it back to re-check that.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      # R is only needed on Windows and macOS (the R reports are about those),
      # and not on the ARM Windows runner. If R setup fails, the Python
      # scripts still run and the R cases are reported as skipped or failed.
      - name: Set up R
        if: env.RUN_R == '1' && runner.os != 'Linux' && matrix.os != 'windows-11-arm'
        continue-on-error: true
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install R packages
        if: env.RUN_R == '1' && runner.os != 'Linux' && matrix.os != 'windows-11-arm'
        continue-on-error: true
        timeout-minutes: 30
        run: Rscript -e 'install.packages(c("arrow", "dplyr", "tibble"), repos = "https://cloud.r-project.org")'
      - name: Run scripts
        env:
          PYTHONUTF8: "1"
          # R cases run only where the two R steps above ran.
          R_CASES: ${{ (env.RUN_R == '1' && runner.os != 'Linux' && matrix.os != 'windows-11-arm') && '1' || '0' }}
        run: python driver.py --out out --label "${{ matrix.os }}"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.os }}
          path: out/
